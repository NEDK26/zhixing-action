<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知行 — 把想法带到生活里</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<header class="top"><a class="brand" href="/">知行 <span>ZHIXING</span></a><span class="top-note">A LITTLE CLOSER, EVERY DAY</span></header>
<main><section class="intro"><div><p class="eyebrow"><span></span> IDEAS INTO ACTION</p><h1>想到了，<br><em>就试着做一点。</em></h1><p class="lead">不必等到准备好。把想法写下来，找到下一步，慢慢把它变成生活的一部分。</p><button class="primary" id="new-project">记录一个想法 <span>↗</span></button></div><aside class="note"><span>NOTE TO SELF</span><p>行动不必很大，<br>但要具体。</p><div class="note-foot">想法 <span>→</span> 下一步 <span>→</span> 进展</div></aside></section>
<section class="projects"><div class="section-head"><div><p class="eyebrow">YOUR SPACE</p><h2>行动中的想法</h2></div><span id="project-count"></span></div><p class="section-copy">每个想法都可以从一个小步骤开始。</p><div id="error" role="alert" hidden></div><div id="project-list" class="project-list"></div><div id="empty" class="empty"><span>✳</span><h3>先记下第一个想法</h3><p>想整理房间、尝试新习惯，或者开启一个一直想做的计划？</p><button id="empty-new">写下来 <span>↗</span></button></div></section>
<footer>知行 <span>为想做的事留一点位置。</span></footer></main>
<dialog id="project-dialog"><form id="project-form"><div class="dialog-head"><div><p class="eyebrow">NEW IDEA</p><h2>记录一个想法</h2></div><button type="button" id="close-dialog" aria-label="关闭">×</button></div><label>想做什么？<input name="title" required maxlength="100" placeholder="例如：布置一个自己喜欢的房间"></label><label>为什么想做？ <span>可选</span><textarea name="why" rows="3" maxlength="500" placeholder="写下它对你的意义"></textarea></label><label>最小的第一步 <span>可选</span><input name="step" maxlength="200" placeholder="例如：找三张喜欢的房间参考图"></label><button class="primary" type="submit">保存想法 <span>→</span></button></form></dialog>
</body></html>
